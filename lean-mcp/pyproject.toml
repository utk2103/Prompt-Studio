[project]
name = "lean-mcp"
version = "1.0.0"
description = "MCP server that serves Prompt-Studio's Lean lazy-senior-dev ruleset as a prompt and a tool."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Utkarsh Upadhyay", email = "utkarsh@m37labs.com"}]

dependencies = [
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/utk2103/Prompt-Studio"
Repository = "https://github.com/utk2103/Prompt-Studio"

[project.scripts]
lean-mcp = "server:main"

[tool.pytest.ini_options]
testpaths = ["test"]
