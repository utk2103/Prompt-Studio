description = "Compress a natural-language memory file (CLAUDE.md, todos, prefs) into lean format to save input tokens."
prompt = "Invoke the compress skill on {{args}}. Preserve every code block, URL, file path, command, technical term, proper noun, date, version, and env var exactly. Drop articles, filler, pleasantries, hedging, and redundant phrasing. Keep markdown structure — headings, bullet nesting, tables, frontmatter. Overwrite the source file with the compressed version; leave a backup at $XDG_DATA_HOME/prompt-studio-compress/backups/ (macOS/Linux) or %LOCALAPPDATA%\\prompt-studio-compress\\backups\\ (Windows). Run `python3 -m scripts <absolute_filepath>` from skills/compress/. If validation fails after 2 retries, leave the original file untouched and report the error."
