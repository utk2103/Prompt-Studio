description = "Quick reference for Lean levels and commands"
prompt = "Show the Lean quick reference. One shot, change nothing: do not switch mode, write flag files, or persist anything. Levels: /prompt-studio:lean lite (build what's asked, name the lazier alternative in one line), /prompt-studio:lean (full, the default ladder: YAGNI then stdlib then native then one line then minimum), /prompt-studio:lean ultra (deletion before addition, challenges the requirement before building). Deactivate with 'stop lean', 'normal mode', or /prompt-studio:lean off; resume anytime with /prompt-studio:lean. Default mode is full; state persists in ~/.claude/.lean-active across turns. The FastAPI adapters (app/services/formats.build_messages), lean-mcp server, and this plugin all share the same builder in app/services/skills.py — zero drift."
