description = "Show Lean's measured impact scoreboard (less code, more speed)"
prompt = "Show the lean gain scoreboard. One shot, change nothing: do not switch mode, write flag files, or persist anything. Render Prompt-Studio's own measured benchmark medians (source benchmarks/results/latest.json + 2026-08-12-lean-vs-ponytail.md; gpt-4o-mini, n=3, 7 tasks) as plain ASCII bars: Lines of code, baseline 100% vs lean 25-35% (down 65-75%); Speed, lean ~4x faster (3.5-4.3x range, full=4.25x). The bar length shows the measured range, the label carries the exact figure. Show NO cost bar: on single-shot tasks lean cost is roughly flat (~100-108% of baseline) because the lean system-prompt input tokens offset the output-token savings, so a cost win would contradict the data — say this explicitly, it is by design not omission. Add a footer 'measured: gpt-4o-mini, n=3, 7 tasks' so the single-model basis is honest. These are medians, not this repo. NEVER print a per-repo savings number. For real per-session figures point to /prompt-studio:lean-stats (actual tokens) and /prompt-studio:lean-debt (counted ledger); for what's still cuttable, /prompt-studio:lean-audit. Report only."
