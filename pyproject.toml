[project]
name = "prompt-studio"
version = "1.0.0"
readme = "README.md"
description = "AI-powered prompt engineering assistant: scoring, validation, optimization, and semantic search."
authors = [
    {name = "Utkarsh Upadhyay", email = "btoshine774@gmail.com"},
]
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # API
    "fastapi[all]>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    # Database + ORM
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    # Vector DB
    "pgvector>=0.3.5",
]

[project.urls]
Homepage = "https://github.com/utk2103/prompt-studio"
Repository = "https://github.com/utk2103/prompt-studio"
Issues = "https://github.com/utk2103/prompt-studio"

[tool.pdm.scripts]
start          = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
dev            = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
migrate        = "alembic upgrade head"
rollback       = "alembic downgrade -1"
make_migration = "alembic revision --autogenerate -m"
test           = "pytest"
lint           = "ruff check ."
fmt            = "ruff format ."
typecheck      = "mypy app"
security       = "bandit -r app"
coverage       = "pytest --cov=app --cov-branch --cov-fail-under=70"

[tool.pdm.dev-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
lint = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".venv", "alembic/versions", "caveman", "frontend"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP", "T20"]
ignore = ["B008"]  # FastAPI Depends() default

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 70
precision = 2
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "caveman", "frontend", "docs"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
